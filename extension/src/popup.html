<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashMaker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="app">FlashMaker</p>
        <h1>Prompt de flashcards</h1>
        <p id="pdfHint" class="muted">Abra um PDF no Chrome para começar.</p>
      </header>

      <section class="panel">
        <label class="field">
          <span>PDF encontrado</span>
          <div id="pdfState" class="readout">Nenhum PDF selecionado</div>
        </label>

        <label class="field">
          <span>Source name</span>
          <input id="sourceName" type="text" />
        </label>

        <label class="field">
          <span>Tema do deck</span>
          <input id="theme" type="text" />
        </label>

        <label class="field">
          <span>Tipo da fonte</span>
          <select id="sourceType"></select>
        </label>

        <label class="field">
          <span>Qualidade da imagem</span>
          <input id="dpi" type="number" min="72" step="1" value="150" />
        </label>

        <label class="field">
          <span>Autores / sociedade</span>
          <input id="sourceAuthors" type="text" />
        </label>

        <label class="field">
          <span>Ano</span>
          <input id="sourceYear" type="text" />
        </label>

        <label class="field">
          <span>Título completo</span>
          <input id="sourceTitle" type="text" />
        </label>

        <label class="field">
          <span>Periódico / livro / instituição</span>
          <input id="sourceContainer" type="text" />
        </label>

        <label class="field">
          <span>Página inicial</span>
          <input id="pageStart" type="number" min="1" step="1" value="1" />
        </label>

        <label class="field">
          <span>Página final</span>
          <input id="pageEnd" type="number" min="1" step="1" value="1" />
        </label>

        <button id="runButton" type="button">Extrair PDF e gerar prompt</button>
      </section>

      <section class="panel">
        <div class="section-head">
          <p class="section-title">Preview da Fonte</p>
        </div>
        <pre id="sourcePreview" class="preview-block"></pre>
      </section>

      <section class="panel">
        <div class="section-head">
          <p class="section-title">Status</p>
        </div>
        <p id="statusText" class="status-text">Pronto.</p>
        <div class="bar">
          <div id="progressBar"></div>
        </div>
        <p id="progressText" class="muted"></p>
      </section>

      <section class="panel">
        <div class="section-head">
          <p class="section-title">Prompt</p>
          <button id="copyPromptButton" type="button" class="ghost">Copiar</button>
        </div>
        <textarea id="promptOutput" readonly placeholder="O prompt gerado vai aparecer aqui."></textarea>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
