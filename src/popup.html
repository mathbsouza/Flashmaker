<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropPDF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="app">CropPDF</p>
        <p id="pdfState" class="title">Nenhum PDF</p>
        <p id="pdfHint" class="muted">Abra um PDF.</p>
      </header>

      <form id="cropForm" autocomplete="off">
        <label>
          <span>Nome-base</span>
          <input id="baseName" type="text" placeholder="Med_Livros_Harrison" />
        </label>

        <div class="row">
          <label>
            <span>Inicial</span>
            <input id="pageStart" type="number" min="1" step="1" value="1" />
          </label>

          <label>
            <span>Final</span>
            <input id="pageEnd" type="number" min="1" step="1" value="1" />
          </label>
        </div>

        <label>
          <span>DPI</span>
          <input id="dpi" type="number" min="1" step="1" value="150" />
        </label>

        <button id="submitBtn" type="submit">Gerar</button>
      </form>

      <section class="status">
        <p id="statusText">Pronto.</p>
        <div class="bar">
          <div id="progressBar"></div>
        </div>
        <p id="progressText" class="muted"></p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
